<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>Wall Panel House — Order Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:22px 18px;text-align:center}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #00000010}button{border:0;border-radius:13px;padding:15px 16px;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin:6px 0}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.success{background:#16a34a;color:#fff}.preview{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:#e5e7eb;display:none}.hidden{display:none!important}.muted{color:#6b7280;font-size:13px}.status{padding:12px;border-radius:12px;background:#f1f5f9;margin-top:10px;font-size:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #e5e7eb;align-items:center}.row:last-child{border-bottom:0}.qty{font-size:25px;font-weight:900;min-width:62px}.item{font-weight:800}.sub{font-size:12px;color:#64748b;margin-top:3px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:800}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}.check{display:flex;align-items:center;gap:10px;font-size:16px}.check input{width:22px;height:22px}input.qtyedit{width:82px;padding:8px;border:1px solid #d1d5db;border-radius:9px;font-size:18px;font-weight:800}.line{padding:12px 0;border-bottom:1px solid #e5e7eb}.line:last-child{border-bottom:0}.linehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.note{font-size:12px;color:#64748b;margin-top:4px}.hand{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:12px;margin-top:10px}.bigtitle{font-size:28px;font-weight:900;margin:4px 0 0}.sectiontag{font-size:12px;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.05em}
</style></head>
<body>
<header><h1>WALL PANEL HOUSE</h1><p>Pull List Scanner • Scan → Confirm → Pull List</p></header>
<main>
<section class="card" id="scanCard">
  <div class="sectiontag">Step 1</div><h2>Scan Order</h2>
  <p class="muted">Take a new photo or choose an existing order photo. The scanner reads the printed order and keeps handwriting separate.</p>
  <input id="camera" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="gallery" type="file" accept="image/*" class="hidden">
  <button class="primary" onclick="camera.click()">📸 TAKE PHOTO</button>
  <button class="secondary" onclick="gallery.click()">🖼️ CHOOSE FROM PHOTOS</button>
  <img id="preview" class="preview">
  <div id="status" class="status hidden"></div>
  <button id="scanBtn" class="success hidden">🧠 SCAN THIS ORDER</button>
</section>

<section id="confirmCard" class="card hidden">
  <div class="sectiontag">Step 2</div><h2>Confirm Scan</h2>
  <div id="orderMeta" class="status"></div>
  <div id="confidence" class="status"></div>
  <div id="handwritten" class="hand hidden"></div>
  <div id="lines"></div>
  <button id="confirmBtn" class="success">✓ CONFIRM — BUILD PULL LIST</button>
  <button id="rescanBtn" class="secondary">↻ RESCAN</button>
</section>

<section id="pullCard" class="card hidden">
  <h2>🧰 PULL LIST</h2>
  <div id="pullSummary" class="status"></div>
  <div id="pullList"></div>
  <button class="primary" onclick="copyList()">📋 COPY PULL LIST</button>
  <button class="secondary" onclick="window.print()">🖨️ PRINT</button>
</section>
</main>
<script>
// Put the secure Cloudflare Worker URL here after deployment. Never put an OpenAI key here.
const API_URL = "";
let selectedFile=null, scanned=null, confirmed=false;
const camera=document.getElementById('camera'),gallery=document.getElementById('gallery');
function setStatus(t){const s=document.getElementById('status');s.textContent=t;s.classList.remove('hidden')}
function choose(file){if(!file)return;selectedFile=file;const img=document.getElementById('preview');img.src=URL.createObjectURL(file);img.style.display='block';setStatus('Photo ready. Tap SCAN THIS ORDER.');document.getElementById('scanBtn').classList.remove('hidden');document.getElementById('confirmCard').classList.add('hidden');document.getElementById('pullCard').classList.add('hidden')}
camera.onchange=e=>choose(e.target.files[0]);gallery.onchange=e=>choose(e.target.files[0]);
function dataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function showScan(ai){scanned=ai;document.getElementById('confirmCard').classList.remove('hidden');document.getElementById('pullCard').classList.add('hidden');
 document.getElementById('orderMeta').innerHTML=`<b>#${esc(ai.order_number||'ORDER')}</b>`;
 const conf=Number(ai.overall_confidence||0);document.getElementById('confidence').innerHTML=conf>=.92?'<span class="badge">SCAN LOOKS GOOD</span>':'<span class="badge warn">CHECK SCAN CAREFULLY</span><br><span class="muted">Confirm the printed quantities before building the pull list.</span>';
 const h=ai.handwritten_notes||[];const hb=document.getElementById('handwritten');if(h.length){hb.classList.remove('hidden');hb.innerHTML='<b>✍️ Handwritten / annotations:</b><br>'+h.map(esc).join('<br>')}else hb.classList.add('hidden');
 document.getElementById('lines').innerHTML=(ai.items||[]).map((x,i)=>`<div class="line"><div class="linehead"><div><div class="item">${esc(x.description||x.sku||'Item')}</div><div class="note">Printed quantity: ${esc(x.quantity_text||'—')}</div></div><input class="qtyedit" data-i="${i}" type="number" min="0" step="1" value="${x.quantity??''}"></div></div>`).join('');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('scanBtn').onclick=async()=>{if(!selectedFile)return;if(!API_URL){setStatus('Secure AI endpoint is not connected yet. The photo/confirm workflow is ready; connect the Cloudflare Worker URL in API_URL.');return}try{setStatus('Scanning order with Vision AI…');const image=await dataUrl(selectedFile);const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Scan failed');showScan(d.ai);setStatus('Scan complete. Check the printed quantities, then confirm.')}catch(e){setStatus('Scan error: '+e.message)}};
document.getElementById('rescanBtn').onclick=()=>{document.getElementById('confirmCard').classList.add('hidden');document.getElementById('pullCard').classList.add('hidden');setStatus('Ready to scan again.')};
document.getElementById('confirmBtn').onclick=()=>{document.querySelectorAll('.qtyedit').forEach(el=>{const i=Number(el.dataset.i);scanned.items[i].quantity=el.value===''?null:Number(el.value);});confirmed=true;buildPull(scanned)};
function buildPull(ai){const r=ai.result||null;let items=[];if(r&&Array.isArray(r.items))items=r.items;else items=calculateLocal(ai);document.getElementById('pullSummary').innerHTML=`<div class="bigtitle">#${esc(ai.order_number||'ORDER')}</div>`;document.getElementById('pullList').innerHTML=items.map((x,i)=>`<div class="row"><label class="check"><input type="checkbox"><span><span class="qty">${x.quantity}</span> <span class="item">${esc(x.name)}</span></span></label></div>`).join('');document.getElementById('pullCard').classList.remove('hidden');document.getElementById('pullCard').scrollIntoView({behavior:'smooth'})}
function calculateLocal(ai){const out=[];const q=Number(ai.section_quantity||0);const type=(ai.section_type||'').toLowerCase();if(q&&type.includes('aluminum')){out.push({name:'ALUMINUM BOARDS',quantity:q*16,source:`${q} aluminum sections × 16`},{name:'POSTS',quantity:q,source:`${q} sections × 1`},{name:'L-CORNERS',quantity:q*4,source:`${q} sections × 4`},{name:'TOP & BOTTOM RAILS',quantity:q*2,source:`${q} sections × 2`},{name:'CAPS',quantity:q*2,source:`${q} sections × 2`})}return out}
function copyList(){const rows=[...document.querySelectorAll('#pullList .row')].map(r=>r.innerText.replace(/\s+/g,' ').trim());navigator.clipboard?.writeText(rows.join('\n'))}
</script></body></html>
